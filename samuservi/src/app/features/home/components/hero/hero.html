<section class="relative min-h-screen flex items-center pt-20 overflow-hidden" id="inicio" appScrollReveal>
  <div class="absolute inset-0 z-0">
          <div
            class="w-full h-full bg-cover bg-center"
            style="background-image: url('https://pin.it/4Z5DvgZNG')"
      ></div> 
    <div class="absolute inset-0 hero-gradient"></div>
  </div>

  <div class="relative z-10 w-full px-margin-mobile md:px-margin-desktop text-on-primary max-w-4xl">
    <h1 class="font-display-lg text-display-lg md:text-[56px] leading-tight mb-6 animate-fade-in-up">
      Tu transporte seguro, rápido y confiable en Guayaquil
    </h1>
    <p class="font-body-lg text-body-lg text-on-primary/90 mb-lg max-w-2xl">
      Servicio de taxi puerta a puerta disponible las 24 horas. Contamos con una flota moderna y
      conductores profesionales certificados para garantizar tu tranquilidad en cada trayecto.
    </p>
    <div class="flex flex-col sm:flex-row gap-4">
      <button
        class="bg-secondary-container text-on-secondary-fixed px-xl py-4 rounded-xl font-bold font-label-lg text-label-lg hover:shadow-xl hover:shadow-secondary-container/30 transition-all flex items-center justify-center gap-2"
        (click)="solicitarServicio()"
      >
        <span class="material-symbols-outlined">hail</span>
        Solicitar servicio
      </button>
      <button
        class="bg-primary-container text-on-primary px-xl py-4 rounded-xl font-bold font-label-lg text-label-lg border border-white/20 hover:bg-white/10 transition-all flex items-center justify-center gap-2"
      >
        <span class="material-symbols-outlined">info</span>
        Conoce nuestra empresa
      </button>
    </div>
  </div>
</section>
