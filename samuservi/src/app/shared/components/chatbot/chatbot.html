<div class="chatbot-container">
  <div class="chatbot-window" [class.active]="isOpen">
    <div class="bg-primary p-4 flex justify-between items-center text-on-primary">
      <span class="font-bold">Asistente SAMUSERVI</span>
      <button class="material-symbols-outlined hover:bg-white/10 rounded-full p-1" (click)="toggleChat()">
        close
      </button>
    </div>

    <div class="p-4 h-64 overflow-y-auto space-y-3 bg-surface-container-low">
      @for (msg of messages; track $index) {
        <div class="bg-white p-3 rounded-lg shadow-sm text-sm border border-outline-variant">
          {{ msg.text }}
        </div>
      }
    </div>

    <div class="p-4 border-t bg-white">
      @if (!hasSubmittedName) {
        <input
          class="w-full text-sm border-outline-variant rounded-lg mb-3"
          [(ngModel)]="nameInputValue"
          (keyup.enter)="submitName()"
          placeholder="Escribe tu nombre..."
          type="text"
        />
        <button
          class="w-full bg-secondary-container text-on-secondary-fixed font-bold py-2 rounded-lg text-sm"
          (click)="submitName()"
        >
          Enviar
        </button>
      } @else {
        <div class="grid grid-cols-1 gap-2 mt-2">
          @for (option of options; track option) {
            <button
              class="text-left p-2 bg-surface-container hover:bg-secondary-container/20 rounded text-xs transition-colors"
              (click)="selectOption(option)"
            >
              {{ option }}
            </button>
          }
        </div>
      }
    </div>
  </div>

  <button
    class="w-14 h-14 bg-secondary-container text-on-secondary-fixed rounded-full shadow-2xl flex items-center justify-center hover:scale-110 transition-transform"
    (click)="toggleChat()"
  >
    <span class="material-symbols-outlined text-3xl">smart_toy</span>
  </button>
</div>
